; Build configuration. One environment per hardware target (docs/HARDWARE.md).
; Versions: latest stable releases as of 2026-10-08.
;
; ESP-IDF settings per env: sdkconfig.defaults (all targets) plus
; targets/<target>.sdkconfig.defaults (board-dependent settings, ADR-010),
; passed via SDKCONFIG_DEFAULTS. Setting SDKCONFIG_DEFAULTS replaces the
; automatic loading of sdkconfig.defaults, so it must be listed explicitly.
; scripts/sdkconfig_guard.py regenerates sdkconfig.<env> when a configuration
; input changes; scripts/sdkconfig_verify.py stops the build if it does not
; match the defaults files or the partition CSV below.
; Hardware target: build_flags selects the profile header
; targets/<target>.h through include/hw_target.h (ADR-004).
; Each partition CSV must match CONFIG_PARTITION_TABLE_CUSTOM_FILENAME in the
; target's sdkconfig file: PlatformIO flashes the CSV given here, ESP-IDF
; checks the app size against the sdkconfig one.

[platformio]
default_envs = xiao_esp32c6_gc9a01

[env]
platform = platformio/espressif32@7.1.3
framework = espidf
board_build.filesystem = littlefs
monitor_speed = 115200
extra_scripts =
  pre:scripts/sdkconfig_guard.py
  pre:scripts/heap_monitor_patch.py
  post:scripts/sdkconfig_verify.py

; Seeed XIAO ESP32-C6 + external 1.28" GC9A01 round display.
[env:xiao_esp32c6_gc9a01]
board = seeed_xiao_esp32c6
board_build.partitions = partitions/4mb_ota_littlefs.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;targets/xiao_esp32c6_gc9a01.sdkconfig.defaults
build_flags = -D FUSSBALL_TARGET_XIAO_ESP32C6_GC9A01

; Waveshare ESP32-S3-LCD-1.28 (non-touch, ESP32-S3R2, 16 MB flash, 2 MB PSRAM).
; PlatformIO has no manifest for this board; the generic S3 DevKitC-1 manifest
; is used and its flash size overridden. PSRAM, flash size and console come
; from the target's sdkconfig file (the manifest's PSRAM fields are not used
; by ESP-IDF builds).
[env:waveshare_esp32s3_lcd128]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions/16mb_ota_littlefs.csv
board_build.cmake_extra_args =
  -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;targets/waveshare_esp32s3_lcd128.sdkconfig.defaults
build_flags = -D FUSSBALL_TARGET_WAVESHARE_ESP32S3_LCD128
; CH343 USB-UART bridge.
upload_speed = 921600
; Do not toggle RTS/DTR when the monitor opens: on the auto-reset circuit
; this holds the chip in reset or download mode (seen on this board).
monitor_rts = 0
monitor_dtr = 0

; Host-only pure-logic tests. Versions checked against official releases on
; 2026-10-09; ESP-IDF and the firmware language standard are unchanged.
[env:native]
platform = platformio/native@1.2.1
framework =
test_framework = unity
test_build_src = no
build_flags = -std=c++20
; Replaces the ESP-IDF configuration scripts of [env].
extra_scripts = pre:scripts/native_sources.py
; Upstream v2.7.0 retains stale 2.6.0 library metadata. The tests verify the
; actual header version; PlatformIO may also download unused registry Unity.
lib_deps = https://github.com/ThrowTheSwitch/Unity.git#v2.7.0
