<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fussball Display</title><style>

:root{
  --ground:#eef3f3; --surface:#ffffff; --sunk:#e3eaeb; --ink:#13202a; --muted:#56676f;
  --line:#cfd9db; --accent:#127a63; --accent-soft:#d5efe7; --on-accent:#ffffff;
  --ok:#1b7340; --ok-soft:#dcf1e3; --warn:#8a5a00; --warn-soft:#fbefd2;
  --err:#b3261e; --err-soft:#fbe1de; --focus:#127a63; --scrim:rgba(10,18,24,.45);
  --mock:#6b4fa3; --mock-soft:#efe9fa; --bezel:#2b3640;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Ubuntu,Cantarell,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:10px; --gap:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#101820; --surface:#16222c; --sunk:#0b1218; --ink:#e4ecee; --muted:#93a5ad;
  --line:#2a3a46; --accent:#49cba0; --accent-soft:#173a33; --on-accent:#06261d;
  --ok:#5fd08b; --ok-soft:#163324; --warn:#f0b54a; --warn-soft:#3a2c10;
  --err:#ff8a80; --err-soft:#3d1a18; --focus:#49cba0; --scrim:rgba(0,0,0,.6);
  --mock:#b9a2ef; --mock-soft:#2a2340; --bezel:#05090c; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#101820; --surface:#16222c; --sunk:#0b1218; --ink:#e4ecee; --muted:#93a5ad;
  --line:#2a3a46; --accent:#49cba0; --accent-soft:#173a33; --on-accent:#06261d;
  --ok:#5fd08b; --ok-soft:#163324; --warn:#f0b54a; --warn-soft:#3a2c10;
  --err:#ff8a80; --err-soft:#3d1a18; --focus:#49cba0; --scrim:rgba(0,0,0,.6);
  --mock:#b9a2ef; --mock-soft:#2a2340; --bezel:#05090c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--sans);padding-inline:16px;padding-block:0 120px}
.wrap{max-width:1100px;margin-inline:auto}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:1.55rem;font-weight:750;letter-spacing:-.01em}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.98rem;font-weight:650}
p{margin:0}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}




header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ground);padding-top:10px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:30px;height:30px;border-radius:50%;background:var(--bezel);display:grid;place-items:center;flex:none}
.logo i{width:20px;height:20px;border-radius:50%;background:#101820;border:2px solid #49cba0;display:block}
.brand b{font-size:1.05rem}
.brand span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.err{background:var(--err-soft);color:var(--err)}
.chip.plain::before{display:none}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
nav button{border:0;background:none;padding:10px 12px;border-bottom:2.5px solid transparent;color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
nav button .dot.e{background:var(--err)}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;cursor:pointer;min-height:36px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--err);border-color:var(--err)}
.btn.danger.solid{background:var(--err);color:var(--surface)}
.btn.ghost{border-color:transparent;background:none}
.btn.icon{padding:6px;min-width:34px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.why{font-size:.8rem;color:var(--muted);margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}


main{padding-block:22px}
.page-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.page-head p{max-width:62ch;color:var(--muted);margin-top:4px}
.section{padding-block:18px;border-top:1px solid var(--line);display:grid;gap:14px}
.section:first-of-type{border-top:0;padding-top:0}
.section > header{position:static;background:none;padding:0}
.section-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.section-head p{color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:var(--gap)}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 28px}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}


.field{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;align-content:start;min-width:0}
.field > label,.field .lbl{font-weight:600;font-size:.9rem}
.ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctl input[type=text],.ctl input[type=number],.ctl input[type=password],.ctl input[type=time],.ctl select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-height:38px;max-width:100%}
.w-s{width:7.5em}.w-m{width:16em}.w-l{width:24em}
.unit{color:var(--muted);font-size:.88rem}
.help{font-size:.82rem;color:var(--muted);max-width:60ch}
.field-error{display:none;font-size:.84rem;color:var(--err);font-weight:600}
.field-error.on{display:flex;gap:6px}
.field-error.on::before{content:"!";display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--err);color:var(--surface);font-size:.7rem;flex:none;margin-top:2px}
.field.bad input,.field.bad select{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
.field.off{opacity:.5}
.field.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--warn-soft)}100%{background:transparent}}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:.9rem}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;flex:none;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{left:19px}
.switch input:focus-visible + .track{outline:2px solid var(--focus);outline-offset:2px}
.switch input:disabled + .track{opacity:.5}
.secret-state{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.expert{border:1px solid var(--line);border-radius:var(--r);padding:0 14px;background:var(--surface)}
details.expert > summary{cursor:pointer;padding:12px 0;font-weight:650}
details.expert > summary span{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
details.expert[open]{padding-bottom:16px}
.notice{border-radius:var(--r);padding:12px 14px;display:grid;gap:4px;border:1px solid}
.notice.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.notice.err{background:var(--err-soft);border-color:var(--err)}
.notice.info{background:var(--accent-soft);border-color:var(--accent)}
.notice b{font-weight:700}


.disc{position:relative;aspect-ratio:1;width:100%;max-width:100%;border-radius:50%;overflow:hidden;container-type:inline-size;background:var(--d-bg);color:var(--d-fg);box-shadow:0 0 0 7px var(--bezel),0 0 0 8px var(--line)}
.disc-wrap{max-width:240px;width:100%;padding:8px;margin-inline:auto}
.disc-wrap.sm{max-width:150px}


.ov{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.ov{grid-template-columns:minmax(0,1fr)}}
.now-cap{text-align:center;display:grid;gap:2px;margin-top:10px}
.match{display:grid;gap:10px}
.match .line{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.match .line b{font-size:1.05rem}
.match .line b:last-child{text-align:right}
.match .sc{font-size:2.3rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.steps{display:grid;gap:8px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:10px;align-items:center}
.steps li::before{counter-increment:s;content:counter(s);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:700;font-size:.8rem;flex:none}
.steps li.done::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.steps{padding:0;margin:0}


.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start}
.pos{width:30px;height:30px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-variant-numeric:tabular-nums}
.item.inactive .item-main{opacity:.55}
.item-main{display:grid;gap:4px;min-width:0}
.item-main .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted)}
.item-side{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:620px){.item{grid-template-columns:auto minmax(0,1fr)}.item-side{grid-column:1/-1;justify-content:flex-start}.item>.tag{grid-column:1/-1;justify-self:start}}
.tag{display:inline-block;font-size:.75rem;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--sunk)}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft)}
.tag.err{background:var(--err-soft);color:var(--err)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--err-soft);border-radius:8px;padding:8px 10px;font-size:.88rem}


.screens{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:var(--gap)}
.screen{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px}
@media (max-width:520px){.screen{grid-template-columns:minmax(0,1fr)}}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors label{display:grid;gap:3px;font-size:.78rem;color:var(--muted);font-weight:600}
.colors input{width:52px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.slides{display:flex;gap:10px;flex-wrap:wrap}
.slide{display:grid;gap:4px;justify-items:center;background:var(--sunk);border-radius:var(--r);padding:8px;width:116px}
.slide .th{width:72px;height:72px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 3px var(--bezel)}
.slide .n{font-size:.78rem;font-weight:650;text-align:center}


.quota{display:grid;gap:6px}
.meter{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:var(--gap)}
.tile{display:grid;gap:8px;align-content:start}
.tile .th{aspect-ratio:1;max-width:100%;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 5px var(--bezel);margin:6px}
.tile .uses{display:flex;flex-wrap:wrap;gap:4px}
.tile.add{border-style:dashed;display:grid;place-items:center;text-align:center;min-height:240px;cursor:pointer;background:none}
.editor{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:24px}
@media (max-width:760px){.editor{grid-template-columns:minmax(0,1fr)}}
.canvas-wrap{max-width:300px;width:100%;margin-inline:auto;aspect-ratio:1;border-radius:50%;overflow:hidden;box-shadow:0 0 0 7px var(--bezel);touch-action:none;cursor:grab;background:#101820}
.canvas-wrap canvas{width:100%;height:100%;display:block}
.progress{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
input[type=range]{accent-color:var(--accent);width:12em;max-width:100%}


.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.08)}
.savebar .in{max-width:1100px;margin-inline:auto;display:grid;gap:8px}
.savebar .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.savebar .top b{margin-right:auto}
.savebar ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;max-height:34vh;overflow:auto;font-size:.86rem}
.savebar li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.savebar li button{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-weight:600;text-align:left}
.savebar li.e button{color:var(--err)}
.savebar .old{color:var(--muted);text-decoration:line-through}


dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:var(--scrim)}
dialog .dh{padding:16px 18px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
dialog .db{padding:14px 18px;display:grid;gap:12px;overflow:auto}
dialog .df{padding:0 18px 16px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog.wide{width:min(860px,calc(100vw - 32px))}
.wizsteps{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem}
.wizsteps span{padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600}
.wizsteps span.on{background:var(--accent);color:var(--on-accent)}
.wizsteps span.done{background:var(--accent-soft);color:var(--accent)}
.choices{display:grid;gap:8px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left}
.choice:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.choice.dis{opacity:.55;cursor:not-allowed}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice small{grid-column:2;color:var(--muted)}
.pick{max-height:300px;overflow:auto;display:grid;gap:6px;padding-right:4px}
.pickcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.pickcols{grid-template-columns:minmax(0,1fr)}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
pre.log{background:var(--sunk);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);overflow:auto;max-height:220px;margin:0}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;margin:0;font-size:.9rem}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;font-variant-numeric:tabular-nums}
@media(max-width:640px){dl.kv{grid-template-columns:minmax(0,1fr);gap:3px}dl.kv dd{margin-bottom:10px}dl.kv dd:last-child{margin-bottom:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{margin:0}.page[hidden],[hidden]{display:none!important}.status-preview{border-radius:50%;background:#101820;color:#e4ecee;aspect-ratio:1;width:220px;max-width:100%;display:grid;align-content:center;justify-items:center;text-align:center;padding:30px;margin:auto;gap:8px;overflow:hidden}.status-preview b{font-size:1.8em;line-height:1.1}.status-preview.rect{border-radius:10px;aspect-ratio:4/3}.tag{overflow-wrap:anywhere}.th img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.toast{position:fixed;inset:auto 16px calc(100px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:650px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 4px 25px #0003}.toast.error{border-color:var(--err);color:var(--err)}.load-card{margin-bottom:16px}.field.bad input,.field.bad select{border-color:var(--err)}.field input[type=file]{max-width:100%}.section .cols{align-items:start}.status-line{white-space:pre-wrap}.log{max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:12px/1.5 var(--mono)}.kv dd{overflow-wrap:anywhere}.status-preview img{max-width:90%;max-height:140px;object-fit:contain}.button-reason{display:grid;justify-items:start;gap:4px}.choice input{pointer-events:none}.canvas-wrap.rect{border-radius:10px;aspect-ratio:4/3}.editor .notice{overflow-wrap:anywhere}.progress{width:100%}.dlg-err{color:var(--err)}.item-main{overflow-wrap:anywhere}.live-dot{color:var(--accent)}
.disc.rect{border-radius:3%}
.disc .nat{position:absolute;left:50%;top:50%;width:100%;max-width:none;transform:translate(-50%,-50%)}
.disc svg{position:absolute;inset:0;width:100%;height:100%;font-family:var(--sans);font-weight:500}.disc text{dominant-baseline:central;white-space:pre}
.screen-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.df .why{margin:0 auto 0 0;align-self:center}
</style></head><body><header><div class="wrap"><div class="bar"><div class="brand"><span class="logo" aria-hidden="true"><i></i></span><div><b id="brand">Fussball Display</b><br><span id="deviceAddress">…</span></div></div><span class="chip warn" id="connection">…</span><button class="btn ghost" id="theme"></button><button class="btn" id="auth" hidden></button></div><nav id="nav" aria-label="Navigation"></nav></div></header><main class="wrap" id="main"></main><div class="savebar" id="savebar" hidden><div class="in" id="savebarIn"></div></div><div id="toast" class="toast" role="status" popover="manual" hidden></div><dialog id="dialog"></dialog><script>
